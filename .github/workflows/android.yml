name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: set -o pipefail; ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log

      - name: Build debug APK
        run: set -o pipefail; ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Report compiler errors as annotations
        if: failure()
        run: |
          cat test.log build.log 2>/dev/null \
            | grep -E "^e: |error:|FAILED|Unresolved|AAPT|What went wrong" -A2 \
            | head -60 | while IFS= read -r line; do echo "::error::${line}"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -o 'message="[^"]*"' "$f" | head -20 | while IFS= read -r m; do echo "::error::TEST ${m}"; done
          done
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sergak-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish "latest" release (direct phone download)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sergak-debug.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest sergak-debug.apk \
            --title "Sergak — so'nggi test versiyasi" \
            --notes "Avtomatik yig'ilgan debug APK (commit ${GITHUB_SHA::7}). Telefoningizga yuklab, o'rnating." \
            --prerelease
